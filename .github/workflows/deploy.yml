name: 构建并发布知识库网站

on:
  push:
    branches:
      - codex/quartz-site-migration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出网站源码
        uses: actions/checkout@v4
        with:
          path: source

      - name: 检出 GitHub Pages 发布分支
        uses: actions/checkout@v4
        with:
          ref: main
          path: published-site

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: 安装依赖
        working-directory: source
        run: npm ci

      - name: 构建 Quartz 网站
        working-directory: source
        run: node quartz/bootstrap-cli.mjs build

      - name: 保留旧文章和原链接
        working-directory: source
        run: node scripts/merge-legacy-site.mjs

      - name: 更新 main 发布目录
        shell: bash
        run: |
          git -C published-site rm -r --ignore-unmatch .
          cp -a source/public/. published-site/
          git -C published-site config user.name "github-actions[bot]"
          git -C published-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C published-site add -A
          if git -C published-site diff --cached --quiet; then
            echo "网站内容没有变化。"
            exit 0
          fi
          git -C published-site commit -m "发布 Quartz 知识库网站"
          git -C published-site push origin main

